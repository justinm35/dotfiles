# ~/.tmux.conf

# Global Settings
set -g mouse on

bind -n M-Right next-window
bind -n M-Left previous-window

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

setw -g mode-keys vi
set -g set-clipboard on

# (Recommended) enable truecolor so hex works everywhere
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# Status bar & window tabs (Rose Pine Colors)
set -g status-style "bg=default,fg=#e0def4"                # bar: base + text
set -g window-status-style "bg=default,fg=#6e6a86"         # inactive: muted
set -g window-status-current-style "bg=default,fg=#f6c177" # active: gold

set -g status-position top
set -g status-justify centre
set -g status-left "#{prefix_highlight}#{p40:session_name}"
set -g status-right "#{p-40;=|40|...:pane_current_path}"
set -g status-right-length 40
set -g status-left-length 40
set -g status-left-style  "bg=default,fg=#cfcfd6"
set -g status-right-style "bg=default,fg=#cfcfd6"
set -g window-status-format "#I #W "
set -g window-status-current-format " #[bold]#I #W "
set -g renumber-windows on

# Claude Popup Setup
set -g focus-events on
set -g mouse on

# Alt-c toggles the Claude float.
# If we're already in the float, kill it (the bg session lives on).
# Otherwise, open it.
# M-c: center popover toggle
bind -n M-c if-shell -F '#{m:claudepop_*,#{session_name}}' \
  'detach-client' \
  "run-shell 'bash ~/.config/tmux/claude-open.sh \"#{pane_current_path}\" center'"

# M-l: right split toggle (1/3 width)
bind -n M-l run-shell 'bash ~/.config/tmux/claude-split.sh "#{pane_current_path}"'

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+/)?(n?vim|vim)$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Switch back to last opened tmux seession 
bind C-b switch-client -l

# Keep tmux's default prefix-o behavior. This also clears the old Opencode
# popup binding when the config is re-sourced.
bind-key o select-pane -t :.+

# Optional: faster key response
set -sg escape-time 0

bind y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit --use-config-file $HOME/.config/lazygit/config.yml"

bind n display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazynotion"

bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "gh dash"

bind-key s display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "spd"

bind h display-popup -xC -yC -w 80% -h 80% -d '#{pane_current_path}' -E 'tmux-sessionizer'




# Initialize TPM (this must come last)
run '~/.config/tmux/plugins/tpm/tpm'
